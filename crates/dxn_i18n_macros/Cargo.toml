[package]
name = "dxn_i18n_macros"
description = "Compile-time checked translations for dxn_i18n: message ids and arguments checked against the crate's MessageFormat 2 messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["i18n", "l10n", "messageformat", "mf2", "translation"]
categories = ["internationalization", "localization", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
dxn_i18n = { path = "../dxn_i18n", version = "0.1.1" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_json.workspace = true
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
unicode-normalization.workspace = true

[dev-dependencies]
dxn_intl = { git = "https://github.com/dXnSix/dXn.Intl", tag = "v0.1.1" }

[lints]
workspace = true

# The messages this crate's own tests are checked against.
[package.metadata.dxn_i18n]
messages = "tests/locales"
default-namespace = "translation"
