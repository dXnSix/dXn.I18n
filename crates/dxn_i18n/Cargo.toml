[package]
name = "dxn_i18n"
description = "Translations for Rust apps with Unicode MessageFormat 2 messages, independent of any UI framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["i18n", "l10n", "messageformat", "mf2", "translation"]
categories = ["internationalization", "localization", "template-engine"]

[dependencies]
# Declared here, not in the workspace table, so release-plz counts a bump as a change to this
# crate and releases it (docs/releasing.md).
dxn_intl = { git = "https://github.com/dXnSix/dXn.Intl", tag = "v0.1.2" }
serde_json.workspace = true
unicode-normalization.workspace = true

[lints]
workspace = true
